name: reproduce

on:
  workflow_dispatch:

jobs:
  tables:
    name: the paper's tables and figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[figures]"
      - run: python scripts/tables.py | diff - results/TABLES.md
      - run: python scripts/figures.py
      - run: python scripts/reproduce.py --list

  reproduce:
    name: ${{ matrix.configuration }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [control, lexcache/threshold-0.8, agenticcache/k1, agenticcache/k2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/reproduce.py ${{ matrix.configuration }}

  gptcache:
    name: gptcache/threshold-0.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . -r requirements/gptcache.txt
      - run: python scripts/reproduce.py gptcache/threshold-0.85
